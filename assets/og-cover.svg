<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#0f1230"/>
    </linearGradient>
    <linearGradient id="accentCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#1653ff"/>
      <stop offset="1" stop-color="#6a3cff"/>
    </linearGradient>
    <linearGradient id="accentWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#ff3c8a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#6a3cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#1653ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1653ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#ff3c8a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff3c8a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Brand mark -->
  <g transform="translate(80, 70)">
    <rect width="56" height="56" rx="14" fill="url(#accentCool)"/>
    <text x="28" y="40" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="#ffffff">Z</text>
    <circle cx="46" cy="14" r="3" fill="#ffd166"/>
    <text x="74" y="38" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#ffffff" opacity="0.85">Z.ai · Bangladesh</text>
  </g>

  <!-- Phase pill -->
  <g transform="translate(80, 200)">
    <rect width="380" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="22" cy="19" r="5" fill="#00d4ff"/>
    <text x="40" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#b8c0e0" letter-spacing="0.5">NATIONAL AI HACKATHON · SEPTEMBER 2026</text>
  </g>

  <!-- Title -->
  <text x="80" y="320" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="url(#accentCool)" letter-spacing="-2">Z.ai National AI Hackathon</text>
  <text x="80" y="395" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="url(#accentWarm)" letter-spacing="-2">Bangladesh 2026</text>

  <!-- Subtitle -->
  <text x="80" y="455" font-family="'Inter', sans-serif" font-size="20" fill="#b8c0e0">Powered by Z.ai · Organized by Z.ai Ambassador Rudra Sarker</text>
  <text x="80" y="490" font-family="'Inter', sans-serif" font-size="20" fill="#b8c0e0">Multi-track · Multi-university · Beginner-friendly</text>

  <!-- Floating badges -->
  <g transform="translate(880, 200)" opacity="0.9">
    <rect width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="60" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b8c0e0">GLM-5.2</text>
  </g>
  <g transform="translate(940, 280)" opacity="0.9">
    <rect width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="65" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b8c0e0">1M context</text>
  </g>
  <g transform="translate(860, 360)" opacity="0.9">
    <rect width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="60" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b8c0e0">AutoGLM</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="url(#accentCool)" opacity="0.5"/>
  <text x="1120" y="568" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8189b3">rudra496.github.io/zai</text>
</svg>
